<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA Hub</title>
<style>
:root{
  --bg:#0a0b0e; --panel:#14161b; --raised:#1c1f26; --line:#292d36;
  --accent:#ff7338; --accent-bg:#322018; --accent-line:#68402e;
  --text:#f5f6fa; --soft:#d1d4dd; --muted:#999fac; --dim:#6f7787;
  --live:#ff525d; --ok:#58c595; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
.top{position:sticky;top:0;z-index:30;height:80px;display:flex;align-items:center;gap:40px;padding:0 30px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;width:178px;cursor:pointer}
.logo b{width:29px;height:34px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:#0a0b0e}
.logo em{font-style:normal;color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;height:38px;width:440px;max-width:100%;padding:0 13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:12px;cursor:text;text-align:left}
.search kbd{margin-left:auto;font:inherit;font-size:10px}
.acc{margin-left:auto;display:flex;align-items:center;gap:22px}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:4px;background:var(--raised);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.badge.live{color:var(--live)} .badge.acc2{background:var(--accent-bg);color:var(--accent)} .badge.ok{color:var(--ok)}
.avatar{width:30px;height:30px;border-radius:99px;background:var(--raised);display:grid;place-items:center;font-size:11px;font-weight:700}
.shell{display:flex;min-height:calc(100vh - 80px)}
.side{width:208px;flex:none;border-right:1px solid var(--line);padding:30px 16px;display:flex;flex-direction:column;gap:8px;position:sticky;top:80px;height:calc(100vh - 80px);overflow:auto}
.nav{display:flex;align-items:center;gap:12px;height:43px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13px;width:100%;text-align:left}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--accent-bg);color:var(--accent);font-weight:700}
.nav small{font-size:10px;color:var(--dim);margin-left:2px}
.lab{background:var(--panel);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.lab h4{font-size:14px} .lab p{font-size:11px;color:var(--muted)} .lab a{font-size:11px;color:var(--accent);cursor:pointer}
.tiny{font-size:10px;color:var(--dim)}
main{flex:1;min-width:0;padding:32px;display:flex;flex-direction:column;gap:32px}
.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
h1{font-size:36px;line-height:1.15;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.sec{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sec-h a,.link{color:var(--accent);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.hot{border-color:var(--accent-line)}
.card.click{cursor:pointer;transition:.15s} .card.click:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;background:var(--raised);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent-line)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#0a0b0e}
.btn.s{padding:6px 10px;font-size:11px}
.btn svg.i{width:16px;height:16px}
.chip{padding:7px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
select.chip{appearance:none;padding-right:12px;background:var(--panel)}
.hero{position:relative;height:350px;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;
  background:radial-gradient(900px 300px at 85% 30%,rgba(253,185,39,.28),transparent 60%),radial-gradient(700px 300px at 100% 80%,rgba(0,122,51,.35),transparent 60%),linear-gradient(120deg,#17120a,#0a0b0e 70%)}
.hero h1{font-size:47px;max-width:570px}
.hero .vs{position:absolute;right:40px;top:30px;font-size:150px;font-weight:800;opacity:.07;letter-spacing:-.05em}
.hero>div{display:flex;flex-direction:column;gap:14px;position:relative;max-width:620px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
.day{min-width:62px;padding:8px 6px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:center;font-size:10px;color:var(--muted);font-weight:600}
.day b{display:block;font-size:17px;color:var(--text)}
.day.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)} .day.on b{color:var(--accent)}
.tm{display:flex;gap:10px;align-items:center;min-width:0}
.logoT{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none;border:2px solid rgba(255,255,255,.12)}
.logoT.sm{width:26px;height:26px;font-size:8px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.score{font-size:21px;font-weight:800}
.dim{color:var(--muted)} .sm{font-size:11px}
.vid{display:flex;flex-direction:column;gap:11px}
.thumb{height:190px;border-radius:var(--r);position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:16px;overflow:hidden;cursor:pointer}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,14,0) 10%,rgba(10,11,14,.9));pointer-events:none}
.thumb>*{position:relative;z-index:1}
.play{width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.15);display:grid;place-items:center;backdrop-filter:blur(4px)}
.thumb .t{display:flex;justify-content:space-between;align-items:flex-start}
.thumb .b{display:flex;justify-content:space-between;align-items:flex-end}
.vinfo{display:flex;gap:10px;align-items:flex-start}
.vinfo>div{flex:1;min-width:0}
.vinfo b{display:block;font-size:14px}
.bm{color:var(--dim);padding:2px} .bm.on{color:var(--accent)} .bm.on svg{fill:var(--accent)}
.pcard .ph{height:190px;border-radius:var(--r);display:flex;justify-content:space-between;align-items:flex-start;padding:16px;position:relative;overflow:hidden}
.pcard .ph .num{position:absolute;left:14px;bottom:-14px;font-size:110px;font-weight:800;opacity:.16;line-height:1}
.pcard{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.tag{color:var(--accent);font-size:10px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv div{background:var(--raised);border-radius:8px;padding:10px;text-align:center}
.kv b{display:block;font-size:18px} .kv span{font-size:10px;color:var(--muted)}
ul.l{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.l li{display:flex;gap:8px;font-size:13px;color:var(--soft)}
ul.l li:before{content:"";width:6px;height:6px;border-radius:99px;background:var(--accent);margin-top:7px;flex:none}
ul.l.bad li:before{background:var(--live)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);font-weight:600;text-align:right;padding:6px 8px;font-size:10px;letter-spacing:.04em}
td{padding:8px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:600}
.tw{overflow:auto}
.crumb{color:var(--muted);font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
textarea,.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;resize:vertical;min-height:70px}
textarea:focus,.inp:focus{outline:1px solid var(--accent-line)}
.inp{min-height:0;height:40px}
.opt{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.opt>div{flex:1;min-width:0} .opt b{display:block;font-size:13px}
.court{background:#0f1218;border:1px solid var(--line);border-radius:10px;width:100%;height:auto}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.timeline{display:flex;flex-direction:column;gap:0}
.timeline div{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--soft)}
.timeline div:first-child{border-top:0}
.timeline b{color:var(--accent);min-width:44px;font-size:12px}
.summary{background:linear-gradient(135deg,var(--accent-bg),var(--panel));border:1px solid var(--accent-line)}
.footer{border-top:1px solid var(--line);padding:16px 0 10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:10px}
.note{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:10px}
/* search overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;padding:80px 16px;backdrop-filter:blur(3px)}
.ov.on{display:block}
.ovb{max-width:620px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ovb .inp{border:0;border-bottom:1px solid var(--line);border-radius:0;height:52px;background:var(--panel);font-size:15px}
.res{max-height:60vh;overflow:auto}
.res button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 16px;text-align:left;font-size:13px}
.res button:hover,.res button.sel{background:var(--raised)}
.res small{margin-left:auto;color:var(--dim);font-size:10px;text-transform:uppercase;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--accent-line);padding:10px 16px;border-radius:10px;font-size:12px;z-index:70;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
.bnav{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.split{grid-template-columns:1fr}.hero h1{font-size:38px}}
@media(max-width:860px){
  .side{display:none}
  .top{height:64px;gap:14px;padding:0 20px}
  .logo{width:auto;font-size:20px} .search{width:auto;flex:1;display:none} .acc{gap:14px}
  .badge.season{display:none}
  main{padding:20px 20px 96px;gap:26px}
  h1{font-size:28px} .hero{height:300px} .hero h1{font-size:30px} .hero .vs{font-size:90px}
  .g3,.g2{grid-template-columns:1fr} .g4{grid-template-columns:1fr} .g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(10,11,14,.96);border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
  .bnav button{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);padding:6px 4px;border-radius:8px;font-weight:600}
  .bnav button.on{color:var(--accent)}
  .toast{bottom:90px}
}
@media(min-width:861px){.msearch{display:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo" data-go="home"><b id="lg"></b><span>NBA <em>Hub</em></span></div>
  <button class="search" data-act="search"><span id="si"></span>Rechercher un joueur, une équipe, un move…<kbd>Ctrl K</kbd></button>
  <div class="acc">
    <span class="badge season">MODE HORS LIGNE</span>
    <button class="msearch" data-act="search" id="si2" aria-label="Recherche"></button>
    <button data-act="notif" id="bell" aria-label="Rappels"></button>
    <div class="avatar" id="av">PA</div>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="app"></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="ov" id="ov"><div class="ovb"><input class="inp" id="q" placeholder="Joueur, équipe, match, move, tactique…" autocomplete="off"><div class="res" id="res"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   NBA HUB — fichier unique
   1) CONFIG & SOURCES DE DONNÉES (API branchables)
   2) DATA (équipes, joueurs, moves, tactiques, vidéos) — à éditer ici
   3) Logique (état, rendu, recherche, calendrier)
   ===================================================================== */

/* ---------- 1. DONNÉES LOCALES ----------
   Aucun appel réseau, aucune clé API. La page et ses données intégrées fonctionnent hors ligne.
   Pour publier un planning local, ajoute des objets dans GAMES au format documenté sous le tableau.
   Les liens vidéo ne s'ouvrent que si tu cliques dessus et nécessitent alors Internet. */
const CONFIG = {TZ:'Europe/Paris'};

/* ---------- 2. DATA ---------- */
const T = (abbr,name,conf,color,div) => ({abbr,name,conf,color,div});
const TEAMS = [
  T('ATL','Atlanta Hawks','E','#e03a3e'),T('BOS','Boston Celtics','E','#1fa463'),T('BKN','Brooklyn Nets','E','#8a8f98'),
  T('CHA','Charlotte Hornets','E','#1d8fb4'),T('CHI','Chicago Bulls','E','#ce1141'),T('CLE','Cleveland Cavaliers','E','#9c2b4a'),
  T('DAL','Dallas Mavericks','O','#2f7fd0'),T('DEN','Denver Nuggets','O','#d9a431'),T('DET','Detroit Pistons','E','#c8102e'),
  T('GSW','Golden State Warriors','O','#2b62d9'),T('HOU','Houston Rockets','O','#ce1141'),T('IND','Indiana Pacers','E','#d9a431'),
  T('LAC','LA Clippers','O','#c8102e'),T('LAL','Los Angeles Lakers','O','#9a6fd1'),T('MEM','Memphis Grizzlies','O','#5d76a9'),
  T('MIA','Miami Heat','E','#c8102e'),T('MIL','Milwaukee Bucks','E','#00712d'),T('MIN','Minnesota Timberwolves','O','#2c8f78'),
  T('NOP','New Orleans Pelicans','O','#85714d'),T('NYK','New York Knicks','E','#f58426'),T('OKC','Oklahoma City Thunder','O','#2a8be0'),
  T('ORL','Orlando Magic','E','#0077c0'),T('PHI','Philadelphia 76ers','E','#2a6ed1'),T('PHX','Phoenix Suns','O','#e56020'),
  T('POR','Portland Trail Blazers','O','#d63a3e'),T('SAC','Sacramento Kings','O','#7a5fb5'),T('SAS','San Antonio Spurs','O','#8b929c'),
  T('TOR','Toronto Raptors','E','#d6264b'),T('UTA','Utah Jazz','O','#4b6ab5'),T('WAS','Washington Wizards','E','#d2354a')
];
const TM = Object.fromEntries(TEAMS.map(t=>[t.abbr,t]));

/* Sources gratuites uniquement. Les liens externes s'ouvrent à la demande. */
const WATCH = {
  youtube:{name:'YouTube NBA officiel',type:'Gratuit',note:'Highlights, Top 10 et résumés publiés gratuitement par la NBA.',url:'https://www.youtube.com/@NBA'},
  nbaapp:{name:'NBA.com / NBA App',type:'Gratuit',note:'Scores, articles, box scores et sélection de vidéos gratuites. Les matchs complets peuvent être payants : ils ne sont pas proposés ici.',url:'https://www.nba.com/games'},
  teamYoutube:{name:'Chaînes officielles des équipes',type:'Gratuit',note:'Rechercher les résumés et conférences de presse sur les chaînes YouTube des franchises.',url:'https://www.youtube.com/results?search_query=NBA+team+official+highlights'},
  fans:{name:'Vidéos de fans sur YouTube',type:'Gratuit',note:'Analyses et compilations communautaires; vérifier les droits et la chaîne qui publie.',url:'https://www.youtube.com/results?search_query=NBA+highlights+analysis'},
  podcasts:{name:'Podcasts NBA gratuits',type:'Gratuit',note:'Émissions et analyses audio disponibles gratuitement sur les plateformes de podcasts.',url:'https://www.youtube.com/results?search_query=NBA+podcast'},
  reddit:{name:'r/nba',type:'Gratuit',note:'Discussions, actualités et fils de suivi en direct par la communauté.',url:'https://www.reddit.com/r/nba/'},
  x:{name:'NBA sur X',type:'Gratuit',note:'Suivre les comptes officiels NBA et des équipes pour les annonces et clips.',url:'https://x.com/NBA'},
  radio:{name:'Radios et commentaires gratuits',type:'Gratuit',note:'Recherche de commentaires et radios NBA gratuits; disponibilité et droits variables selon le marché.',url:'https://www.youtube.com/results?search_query=NBA+radio+free+live+commentary'}
};

/* Planning local: pas de match ou de score inventé. Exemple d'objet à copier puis compléter :
   {date:'2026-11-08',hour:'01:30',home:'BOS',away:'NYK',homeScore:null,awayScore:null,
    status:'up',stake:'Match de saison régulière',source:'Programme officiel consulté le 2026-11-07'}
   Pour un match terminé, renseigne les scores; n'indique "live" qu'avec un score/clock vérifié.
   Les effectifs et standings seront complétés dans les blocs de données suivants. */
const GAMES = [];

/* Vidéos : liens de RECHERCHE officiels YouTube (toujours valides). Remplace par un ID précis : {id:'xxxx'} -> https://youtu.be/xxxx */
const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
const NBA_YT = q => yt('NBA ' + q);
const V = (id,title,sub,len,hue,q,tag) => ({id,title,sub,len,hue,url:NBA_YT(q),tag});
const VIDEOS = [
  V('v1','Lakers – Celtics : une rivalité, un show','LAL vs BOS · Résumé du match','09:42','#9a6fd1','Lakers Celtics full game highlights','game'),
  V('v2','Stephen Curry, le tir comme une science','Golden State · 3 points','04:18','#2b62d9','Stephen Curry best shooting highlights','player'),
  V('v3','Anthony Edwards décolle au-dessus du cercle','Minnesota · Top plays','02:36','#2c8f78','Anthony Edwards top plays dunks','player'),
  V('v4','Top 10 de la nuit','Toute la ligue · Top 10','03:10','#ff7338','Top 10 plays of the night','top'),
  V('v5','Victor Wembanyama : le chaos défensif','San Antonio · Contres','05:02','#8b929c','Victor Wembanyama blocks defense highlights','player'),
  V('v6','Shai Gilgeous-Alexander, maître du mid-range','Oklahoma City · Isolation','06:21','#2a8be0','Shai Gilgeous-Alexander mid range highlights','player'),
  V('v7','Nikola Jokić, le cerveau du jeu','Denver · Passes','07:15','#d9a431','Nikola Jokic passing highlights','player'),
  V('v8','Kyrie Irving, la clinique du dribble','Dallas · Handle','04:40','#2f7fd0','Kyrie Irving handles highlights','player')
];

/* Joueurs — fiches d'étude intégrées. Les statistiques non datées sont indicatives, pas du direct. */
const CATS = {
  pg:'Meneurs / créateurs',sh:'Shooters',wing:'Ailiers polyvalents',pf:'Ailiers forts / finishers',c:'Pivots / défenseurs intérieurs',
  def:'Défenseurs élites',dribble:'Étudier : dribble',shoot:'Étudier : shoot',post:'Étudier : post-up',read:'Étudier : lecture de jeu',trans:'Étudier : transition'
};
const P = (id,name,team,pos,num,cats,focus,style,pros,cons,stats,study,tips,q) => ({id,name,team,pos,num,cats,focus,style,pros,cons,stats,study,tips,q:q||name});
const PLAYERS = [
  P('curry','Stephen Curry','GSW','Meneur',30,['pg','sh','shoot'],'Tir & déplacements','Tireur le plus influent de l\'histoire : gravité énorme, tir en mouvement, relâchement ultra rapide.',
    ['Tir en sortie de écran / off-ball','Handle serré pour créer l\'espace','Lecture des fermetures de défense'],['Défense 1 contre 1 limitée','Contact en finition'],{PTS:'~25',REB:'~5',AST:'~6','3P%':'~40%'},
    ['Courses off-ball autour des écrans (« relocation »)','Step-back et pull-up à 8-9 m','Pick & roll avec drag screen en transition'],
    ['Travaille le tir en 1-2 temps pieds ouverts vers le panier','Tire toujours après un faux départ (jab/shake) pour décaler le défenseur','Garde le coude dans l\'axe : trajectoire haute et douce'],'Stephen Curry highlights'),

/* ---------- utilitaires ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parisParts(d){ const f=new Intl.DateTimeFormat('fr-FR',{timeZone:CONFIG.TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d); const o={}; f.forEach(p=>o[p.type]=p.value); return o }
function todayISO(){ const p=parisParts(new Date()); return `${p.year}-${p.month}-${p.day}` }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10) }
function fmtDate(iso,o){ return new Date(iso+'T12:00:00Z').toLocaleDateString('fr-FR',Object.assign({timeZone:'UTC'},o)) }
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619) } return h>>>0 }
/* heure Paris -> instant UTC */
function parisToUTC(iso,hhmm){ const [h,m]=hhmm.split(':').map(Number); const guess=new Date(`${iso}T${hhmm}:00Z`); const p=parisParts(guess); const asParis=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute); const diff=asParis-guess.getTime(); return new Date(guess.getTime()-diff) }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2200) }

/* ---------- données dérivées ---------- */
function gamesOn(iso){
  return GAMES.filter(g=>g.date===iso).map(g=>{
    const id=g.id||`${g.date}-${g.away}-${g.home}`;
    const start=parisToUTC(addDays(g.date,1),g.hour);
    const home=TM[g.home], away=TM[g.away];
    const conf=home.conf===away.conf?(home.conf==='E'?'Est':'Ouest'):'Inter-conf.';
    return {...g,id,start:start.getTime(),fh:g.homeScore??null,fa:g.awayScore??null,conf,seed:hash(id),wb:[]};
  }).sort((a,b)=>a.start-b.start);
}
/* Statut renseigné localement : aucun score live n'est extrapolé. */
function status(g,now=Date.now()){
  if(g.status==='final'||g.status==='fin') return {k:'fin',lbl:'TERMINÉ',sh:g.fh,sa:g.fa};
  if(g.status==='live') return {k:'live',lbl:'● EN DIRECT',clock:g.clock||'',sh:g.fh,sa:g.fa};
  return {k:'up',lbl:now<g.start?'À VENIR':'À ACTUALISER'};
}
function allGames(from=-3,to=7){ const t=todayISO(); const out=[]; for(let i=from;i<=to;i++) out.push(...gamesOn(addDays(t,i))); return out }
function findGame(id){ return allGames(-10,10).find(g=>g.id===id) }
function box(g){ return g.boxScore||{h:[],a:[]} }
const sc = (g)=>{ const s=status(g); return s };
function tlogo(ab,sm){ const t=TM[ab]; return `<div class="logoT ${sm?'sm':''}" style="background:${t.color}">${ab}</div>` }

function filteredGames(){
  let g = gamesOn(S.date);
  if(S.conf!=='all') g=g.filter(x=>TM[x.home].conf===S.conf||TM[x.away].conf===S.conf);
  if(S.team!=='all') g=g.filter(x=>x.home===S.team||x.away===S.team);
  if(S.onlyFollow) g=g.filter(x=>isFollow(x.home)||isFollow(x.away));
  if(S.status!=='all') g=g.filter(x=>status(x).k===S.status);
  return g;
}

  return `<div class="chips">

  return `<span class="crumb" data-go="matches">${ic('back')}Retour aux matchs</span>
  <div class="card ${s.k==='live'?'hot':''}"><div class="mrow"><div class="chips"><span class="badge ${s.k==='live'?'live':''}">${s.lbl}${s.clock?' · '+s.clock:''}</span><span class="badge">${g.conf}</span><span class="badge">${fmtDate(g.date,{day:'numeric',month:'short'})} · ${g.hour} Paris</span></div>
    <button class="bm ${wOn?'on':''}" data-act="wm" data-id="${g.id}">${ic('bm')}</button></div>
    <div class="mrow" style="padding:12px 0">${[g.away,g.home].map((ab,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;text-align:center">${tlogo(ab)}<b>${TM[ab].name}</b><span style="font-size:42px;font-weight:800;line-height:1">${hasScore?(i?sh:sa):'—'}</span><button class="btn s" data-act="fol" data-id="${ab}">${isFollow(ab)?'★ Suivie':'☆ Suivre'}</button></div>`).join('<span class="dim" style="font-weight:700">VS</span>')}</div>

    ${topAll.length?`<div class="card"><h3>Top performers</h3><div class="grid g3">${topAll.slice(0,3).map(p=>`<div class="kv" style="grid-template-columns:1fr"><div>${tlogo(p.t,1)}<b>${p.pts}</b><span>${esc(p.n)}</span><span style="display:block">${p.reb??'—'} reb · ${p.ast??'—'} ast</span></div></div>`).join('')}</div></div>`:''}

  return `<svg class="court" viewBox="0 0 200 150"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0l7 3.5L0 7z" fill="#ff7338"/></marker></defs>

/* ---------- recherche globale ---------- */
function searchIndex(){
  const out=[];
  TEAMS.forEach(t=>out.push({k:'Équipe',t:t.name,go:['planning',null],team:t.abbr}));
  PLAYERS.forEach(p=>out.push({k:'Joueur',t:p.name+' · '+TM[p.team].abbr,go:['player',p.id]}));
  MOVES.forEach(m=>out.push({k:'Move',t:m.name,go:['moves',m.id]}));
  TACTICS.forEach(t=>out.push({k:'Tactique',t:t.name,go:['tactics',t.id]}));
  allGames(-1,3).forEach(g=>out.push({k:'Match',t:`${TM[g.away].name} @ ${TM[g.home].name} · ${fmtDate(g.date,{day:'numeric',month:'short'})}`,go:['match',g.id]}));
  return out;
}
let IDX=null, selI=0, RES=[];
function openSearch(){ IDX=IDX||searchIndex(); $('#ov').classList.add('on'); $('#q').value=''; doSearch(''); setTimeout(()=>$('#q').focus(),30) }
function closeSearch(){ $('#ov').classList.remove('on') }
function doSearch(q){
  q=q.toLowerCase().trim(); RES=(q?IDX.filter(x=>x.t.toLowerCase().includes(q)):IDX.filter(x=>x.k==='Joueur').slice(0,6)).slice(0,30); selI=0;
  $('#res').innerHTML = RES.length?RES.map((r,i)=>`<button class="${i===0?'sel':''}" data-ri="${i}">${r.t}<small>${r.k}</small></button>`).join(''):'<div class="empty" style="border:0">Aucun résultat</div>';
}
function pick(i){ const r=RES[i]; if(!r) return; closeSearch(); if(r.team){ S.team=r.team; S.date=todayISO(); go('planning') } else go(r.go[0],r.go[1]) }

/* ---------- calendrier (.ics) ---------- */
function ics(g){
  const f=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NBA Hub//FR','BEGIN:VEVENT',`UID:${g.id}@nbahub`,`DTSTAMP:${f(Date.now())}`,`DTSTART:${f(g.start)}`,`DTEND:${f(g.start+2.5*3600e3)}`,`SUMMARY:NBA · ${TM[g.away].name} @ ${TM[g.home].name}`,`DESCRIPTION:${g.stake} — heure de Paris ${g.hour}`,'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY','DESCRIPTION:Coup d\'envoi dans 15 min','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'})); a.download=`nba-${g.id}.ics`; a.click(); toast('Événement .ics téléchargé');
}
function remind(g){
  if(mem.remind.includes(g.id)){ mem.remind=mem.remind.filter(x=>x!==g.id); save(); toast('Rappel retiré'); render(); return }
  mem.remind.push(g.id); save(); toast('Rappel activé (15 min avant, onglet ouvert)');
  if('Notification' in window && Notification.permission==='default') try{ Notification.requestPermission() }catch(e){}
  render();
}
setInterval(()=>{ const n=Date.now(); mem.remind.forEach(id=>{ const g=findGame(id); if(!g) return; const d=g.start-n; if(d>0&&d<15*60e3&&!remind.sent?.[id]){ remind.sent=remind.sent||{}; remind.sent[id]=1; toast(`Coup d'envoi bientôt : ${g.away} @ ${g.home}`); try{ if(Notification.permission==='granted') new Notification('NBA Hub',{body:`${g.away} @ ${g.home} à ${g.hour}`}) }catch(e){} } }) },30000);

/* ---------- événements ---------- */
const toggle=(arr,pred,item)=>{ const i=arr.findIndex(pred); if(i>=0) arr.splice(i,1); else arr.push(item); return i<0 };
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-ri]'); if(r){ pick(+r.dataset.ri); return }
  if(e.target===$('#ov')){ closeSearch(); return }
  const a=e.target.closest('[data-act]');
  if(a){ e.preventDefault(); e.stopPropagation(); const id=a.dataset.id, act=a.dataset.act;
    if(act==='search') return openSearch();
    if(act==='notif'){ toast(mem.remind.length?`${mem.remind.length} rappel(s) actif(s)`:'Aucun rappel : utilise « Rappel » sur un match'); return }
    if(act==='fol'){ toggle(mem.follow,x=>x===id,id)?toast(TM[id].name+' suivie'):toast('Équipe retirée'); }
    if(act==='wm'){ toggle(mem.watch,w=>w.type==='match'&&w.id===id,{type:'match',id})?toast('Ajouté à ma watchlist'):toast('Retiré'); }
    if(act==='wp'){ toggle(mem.watch,w=>w.type==='player'&&w.id===id,{type:'player',id})?toast('Ajouté à ma watchlist'):toast('Retiré'); }
    if(act==='wmv'){ toggle(mem.watch,w=>w.type==='move'&&w.id===id,{type:'move',id})?toast('Ajouté à ma watchlist'):toast('Retiré'); }
    if(act==='wv'){ toggle(mem.watch,w=>w.type==='video'&&w.id===id,{type:'video',id})?toast('Vidéo enregistrée'):toast('Retirée'); }
    if(act==='wt'){ toggle(mem.watch,w=>w.type==='tactic'&&w.id===id,{type:'tactic',id})?toast('Ajouté à ma watchlist'):toast('Retiré'); }
    if(act==='rmw'){ const t=a.dataset.t; if(t==='team') mem.follow=mem.follow.filter(x=>x!==id); else mem.watch=mem.watch.filter(w=>!(w.type===t&&w.id===id)); }
    if(act==='onlyf'){ S.onlyFollow=!S.onlyFollow }
    if(act==='ics'){ const g=findGame(id); if(g) ics(g); return }
    if(act==='rem'){ const g=findGame(id); if(g) remind(g); return }
    save(); const y=window.scrollY; render(); window.scrollTo({top:y}); return }
  const set=e.target.closest('[data-set]'); if(set){ S[set.dataset.set]=set.dataset.v; const y=window.scrollY; render(); window.scrollTo({top:y}); return }
  const d=e.target.closest('[data-date]'); if(d){ S.date=d.dataset.date; const y=window.scrollY; render(); window.scrollTo({top:y}); return }
  if(e.target.closest('a[href]')) return;
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go,g.dataset.arg); if(g.dataset.go==='moves'&&g.dataset.arg) setTimeout(()=>document.getElementById('mv-'+g.dataset.arg)?.scrollIntoView({behavior:'smooth',block:'center'}),50) }
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-sel=team]')){ S.team=e.target.value; render() }
  if(e.target.matches('[data-date-in]')&&e.target.value){ S.date=e.target.value; render() }
});
document.addEventListener('input',e=>{
  if(e.target.matches('[data-note]')){ const k=e.target.dataset.note; if(e.target.value) mem.notes[k]=e.target.value; else delete mem.notes[k]; save() }
  if(e.target.id==='q') doSearch(e.target.value);
  if(e.target.matches('[data-pq]')){ S.pq=e.target.value; const pos=e.target.selectionStart; render(); const el=document.querySelector('[data-pq]'); el.focus(); el.setSelectionRange(pos,pos) }
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return }
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); openSearch(); return }
  if($('#ov').classList.contains('on')){
    if(e.key==='Escape') closeSearch();
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); selI=Math.max(0,Math.min(RES.length-1,selI+(e.key==='ArrowDown'?1:-1))); document.querySelectorAll('#res button').forEach((b,i)=>b.classList.toggle('sel',i===selI)); document.querySelectorAll('#res button')[selI]?.scrollIntoView({block:'nearest'}) }
    if(e.key==='Enter') pick(selI);
  }
});
/* démarrage + hash */
(function(){ const h=location.hash.slice(1).split('/'); if(h[0]&&NAV.some(n=>n[0]===h[0])||['match','player'].includes(h[0])){ S.view=h[0]; S.arg=h[1]||null } render() })();
setInterval(()=>{ if(['home','planning','matches','match'].includes(S.view) && !document.activeElement.matches('input,textarea,select')) { const y=window.scrollY; render(); window.scrollTo({top:y}) } },60000);
</script>
